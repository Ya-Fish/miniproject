<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dark">

  <!-- ══ HERO HEADER ══ -->
  <header class="hero">
    <div class="hero-left">
      <div id="clock">00:00:00</div>
      <div id="date-display"></div>
      <div id="greeting-text" class="hero-greeting"></div>
    </div>
    <div class="hero-right">
      <div class="name-row">
        <input id="name-input" type="text" placeholder="Your name…" maxlength="30" />
        <button id="name-save">Save</button>
      </div>
      <button id="theme-toggle" title="Toggle theme">* Dark mode</button>
    </div>
  </header>

  <!-- ══ BODY LAYOUT ══ -->
  <div class="layout">

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="sidebar">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2>Focus Timer [>]</h2>
        <div class="timer-ring-wrap">
          <svg class="timer-ring" viewBox="0 0 120 120">
            <circle class="ring-bg"   cx="60" cy="60" r="52"/>
            <circle class="ring-fill" cx="60" cy="60" r="52" id="ring-fill"/>
          </svg>
          <div class="timer-display" id="timer-display">25:00</div>
        </div>
        <div class="timer-duration-row">
          <label>Min:</label>
          <input id="custom-minutes" type="number" min="1" max="120" value="25" />
          <button id="set-time-btn">Set</button>
        </div>
        <div class="timer-controls">
          <button id="timer-start">▶ Start</button>
          <button id="timer-stop" disabled>⏸ Pause</button>
          <button id="timer-reset">↺ Reset</button>
        </div>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <h2>Quick Links [~]</h2>
        <div class="link-input-group">
          <input id="link-name" type="text" placeholder="Label…" maxlength="30" />
          <input id="link-url"  type="url"  placeholder="https://…" maxlength="200" />
          <button id="link-add">Add</button>
        </div>
        <div id="links-grid"></div>
      </section>

    </aside>

    <!-- ── MAIN PANEL ── -->
    <main class="main-panel">

      <!-- To-Do List -->
      <section class="card todo-card">
        <div class="todo-header">
          <h2>To-Do List [*]</h2>
          <span id="task-count"></span>
        </div>

        <div class="todo-input-row">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="80" />
          <button id="todo-add">Add</button>
        </div>

        <div class="todo-toolbar">
          <select id="sort-select">
            <option value="default">Sort: Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done">Done last</option>
            <option value="undone">Undone first</option>
          </select>
        </div>

        <ul id="todo-list"></ul>
      </section>

    </main>
  </div>

  <!-- ══ EDIT MODAL ══ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Edit Task</h3>
      <input id="edit-input" type="text" maxlength="80" />
      <div class="modal-actions">
        <button id="edit-save">Save</button>
        <button id="edit-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
